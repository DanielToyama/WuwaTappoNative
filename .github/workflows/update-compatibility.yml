name: Update compatibility

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-official-version:
    name: Sync official version
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync compatibility.json
        shell: pwsh
        run: ./tools/update-compatibility.ps1

      - name: Commit changes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/compatibility.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "No compatibility changes."
            exit 0
          }
          git commit -m "同步官方客户端版本"
          git push
